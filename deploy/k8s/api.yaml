apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: weight-and-balance-api-strip
  labels:
    app.kubernetes.io/name: weight-and-balance
spec:
  stripPrefix:
    prefixes:
      - /bakat/api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weight-and-balance-api
  labels:
    app.kubernetes.io/name: weight-and-balance
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weight-and-balance
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weight-and-balance
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Build and push this tag before applying; see the repository README.
          image: 192.168.68.59:30500/weight-and-balance:web-20261031-1793466443
          imagePullPolicy: Always
          command:
            - uvicorn
          args:
            - api:app
            - --app-dir
            - app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --root-path
            - /bakat/api
          env:
            - name: LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: weight-and-balance-api
  labels:
    app.kubernetes.io/name: weight-and-balance
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weight-and-balance
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weight-and-balance-api
  labels:
    app.kubernetes.io/name: weight-and-balance
    app.kubernetes.io/component: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: weight-and-balance-weight-and-balance-api-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: 404nootfound.com
      http:
        paths:
          - path: /bakat/api
            pathType: Prefix
            backend:
              service:
                name: weight-and-balance-api
                port:
                  name: http
