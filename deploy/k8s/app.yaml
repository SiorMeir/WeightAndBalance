apiVersion: apps/v1
kind: Deployment
metadata:
  name: weight-and-balance
  labels:
    app.kubernetes.io/name: weight-and-balance
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weight-and-balance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weight-and-balance
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Build and push this tag before applying; see the repository README.
          image: ghcr.io/siormeir/weight-and-balance:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: STREAMLIT_SERVER_ENABLE_CORS
              value: "false"
            - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
              value: "true"
            - name: STREAMLIT_SERVER_BASE_URL_PATH
              value: "/bakat/demo"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: weight-and-balance
  labels:
    app.kubernetes.io/name: weight-and-balance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weight-and-balance
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weight-and-balance
  labels:
    app.kubernetes.io/name: weight-and-balance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: 404nootfound.com
      http:
        paths:
          - path: /bakat/demo
            pathType: Prefix
            backend:
              service:
                name: weight-and-balance
                port:
                  name: http
